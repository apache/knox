services:
  knox-dev:
    build:
      context: ../../../
      dockerfile: .github/workflows/build/Dockerfile
    image: apache/knox-dev:${IMAGE_TAG:-master}

  ldap:
    image: apache/knox-dev:${IMAGE_TAG:-master}
    command: /ldap.sh
    depends_on:
      - knox-dev

  # Lightweight single-node Kubernetes (k3s) used to back the k8s
  # ServiceAccountValidator. It exposes a real API server that the fabric8
  # client inside Knox talks to. --tls-san=k3s makes the API server cert valid
  # for the "k3s" compose hostname so the rewritten kubeconfig can target it.
  #
  # The service-account-issuer/jwks-uri args make k3s a real OIDC issuer at
  # https://k3s:6443 whose discovery + JWKS endpoints Knox can fetch. This lets
  # the RFC 8693 token-exchange path (test_k8s_delegation.py) verify real
  # ServiceAccount projected tokens, whose 'iss' then resolves to https://k3s:6443.
  k3s:
    image: rancher/k3s:v1.31.5-k3s1
    command:
      - server
      - --disable=traefik
      - --disable=metrics-server
      - --disable=servicelb
      - --disable=local-storage
      - --tls-san=k3s
      - --write-kubeconfig-mode=666
      - --kube-apiserver-arg=service-account-issuer=https://k3s:6443
      - --kube-apiserver-arg=service-account-jwks-uri=https://k3s:6443/openid/v1/jwks
      # k3s defaults the apiserver to --anonymous-auth=false, which rejects Knox's
      # unauthenticated OIDC discovery/JWKS fetch at the authentication layer (401),
      # before RBAC. Re-enable it so the knox-sa-issuer-discovery ClusterRoleBinding
      # (system:service-account-issuer-discovery -> system:unauthenticated, created by
      # k8s-bootstrap) can grant anonymous access to exactly those two endpoints.
      - --kube-apiserver-arg=anonymous-auth=true
    privileged: true
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
    tmpfs:
      - /run
      - /var/run
    volumes:
      - k3s-output:/output

  # One-shot bootstrap: waits for the k3s API, rewrites the generated kubeconfig
  # so its server points at the "k3s" hostname (instead of 127.0.0.1), and
  # applies the test ServiceAccount fixtures. Knox waits for this to finish.
  k8s-bootstrap:
    image: rancher/k3s:v1.31.5-k3s1
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -e
        echo 'Waiting for k3s kubeconfig...'
        until [ -f /output/kubeconfig.yaml ]; do sleep 2; done
        export KUBECONFIG=/output/knox-kubeconfig.yaml
        echo 'Waiting for k3s API to be ready...'
        # k3s regenerates its CA and rewrites kubeconfig.yaml on every (re)start,
        # and a persisted volume may still hold a stale copy from a prior run.
        # Re-derive the knox kubeconfig on each attempt so we converge on the live
        # CA: the loop only exits once kubectl actually connects with it.
        until
          sed 's#https://127.0.0.1:6443#https://k3s:6443#g' \
            /output/kubeconfig.yaml > /output/knox-kubeconfig.yaml
          kubectl get --raw='/readyz' >/dev/null 2>&1
        do
          sleep 3
        done
        echo 'Applying test fixtures...'
        kubectl apply -f /manifests/
        kubectl get serviceaccount test-sa -n test

        echo 'Opening anonymous access to the OIDC discovery + JWKS endpoints...'
        # Knox fetches /.well-known/openid-configuration and /openid/v1/jwks
        # unauthenticated on the token-exchange path; k8s gates these behind the
        # service-account-issuer-discovery ClusterRole, so bind it to
        # system:unauthenticated for the throwaway CI cluster.
        kubectl create clusterrolebinding knox-sa-issuer-discovery \
          --clusterrole=system:service-account-issuer-discovery \
          --group=system:unauthenticated \
          --dry-run=client -o yaml | kubectl apply -f -

        echo 'Exporting k3s CA cert, issuer URL and a projected SA token...'
        # The kubeconfig CA is the API server's serving CA -- exactly what the JVM
        # needs to trust the HTTPS discovery/JWKS endpoints. knox imports it into
        # cacerts on startup (see gateway-k8s-delegation.sh).
        kubectl config view --raw \
          -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
          | base64 -d > /output/k3s-ca.crt
        printf 'https://k3s:6443' > /output/issuer-url
        # Projected SA token for namespace test / serviceaccount test-sa. Its 'iss'
        # is https://k3s:6443 (the configured service-account-issuer).
        kubectl create token test-sa -n test --duration=3600s > /output/sa-token
        echo 'k8s bootstrap complete'
    volumes:
      - k3s-output:/output
      - ./k8s/manifests:/manifests:ro
    depends_on:
      - k3s

  knox:
    image: apache/knox-dev:${IMAGE_TAG:-master}
    # Custom entrypoint: import the k3s serving CA into the JVM cacerts (so the
    # token-exchange path can fetch the k3s OIDC discovery/JWKS over HTTPS), then
    # hand off to the standard /gateway.sh.
    command: /gateway-k8s-delegation.sh
    environment:
      # Point the fabric8 client used by the k8s ServiceAccountValidator at k3s.
      - KUBECONFIG=/k3s/knox-kubeconfig.yaml
    volumes:
      # Mount topologies from the workspace so config changes apply on restart
      - ../build/conf/topologies:/knox-runtime/conf/topologies
      - ./logs:/knox-runtime/logs
#      - ./knoxshell:/knoxshell
      - k3s-output:/k3s:ro
      - ./k8s-delegation/gateway-k8s-delegation.sh:/gateway-k8s-delegation.sh:ro
    depends_on:
      ldap:
        condition: service_started
      k8s-bootstrap:
        condition: service_completed_successfully

  tests:
    image: python:3.10-slim
    working_dir: /tests
    volumes:
      - ../tests:/tests
      # Exposes the exported SA token + issuer URL to test_k8s_delegation.py.
      - k3s-output:/k3s:ro
    environment:
      - KNOX_GATEWAY_URL=https://knox:8443/
    command: >
      bash -c "pip install -r requirements.txt
      && pylint *.py
      && echo 'Waiting for knox...'
      && sleep 30
      && pytest --ignore=test_single_eku_mtls.py --ignore=test_single_eku_no_mtls.py --ignore=test_knoxidf_federation.py --ignore=test_knox_hashicorp_vault_alias.py --ignore-glob=test*_with_role_lookup.py --junitxml=test-results.xml"
    depends_on:
      - knox

volumes:
  k3s-output:

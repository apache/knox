# Override that reconfigures the base compose stack to use the REST roles lookup
# strategy and runs ONLY the REST roles lookup E2E tests
# (test*_with_rest_role_lookup.py), which the base docker-compose ignores.
#
# The override:
#   - adds a `roles-api` service: a stdlib-only mock of the roles REST API
#     (role-lookup-rest/mock_roles_api.py) serving the role assignments in
#     role-lookup/roles.json, the file the file-strategy override uses,
#   - mounts the REST-flavoured gateway-site.xml over the baked one; it also
#     sets gateway.ldap.interceptor.roleslookup.lowercaseIds=true,
#   - points the `tests` service at the REST roles lookup suite.
#
# Usage:
#   cd .github/workflows/compose
#   docker compose \
#     -f docker-compose.yml -f docker-compose.role-lookup-rest.yml \
#     up --build --abort-on-container-exit --exit-code-from tests
services:
  roles-api:
    image: python:3.10-slim
    command: python /mock/mock_roles_api.py
    environment:
      - ROLES_FILE=/data/roles.json
      - PORT=8080
      # Flush request logs straight to the container log for diagnostics.
      - PYTHONUNBUFFERED=1
    volumes:
      - ./role-lookup-rest/mock_roles_api.py:/mock/mock_roles_api.py:ro
      - ./role-lookup/roles.json:/data/roles.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  knox:
    volumes:
      - ./role-lookup-rest/gateway-site.xml:/knox-runtime/conf/gateway-site.xml:ro
    depends_on:
      roles-api:
        condition: service_healthy

  tests:
    command: >
      bash -c "pip install -r requirements.txt
      && pylint test*_with_rest_role_lookup.py
      && echo 'Waiting for knox...'
      && sleep 30
      && pytest test*_with_rest_role_lookup.py --junitxml=test-results-rest-role-lookup.xml"
